services:
  - type: web
    name: sendport
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: postgresql://postgres.wdmhfrbygqrcjxebjlrk:rf.%26HN%243im%23%2F2BK@aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
      - key: NEXT_PUBLIC_APP_URL
        value: https://getsendport.com
      - key: NEXT_PUBLIC_SITE_NAME
        value: Sendport
      - key: NEXT_PUBLIC_SITE_DOMAIN
        value: getsendport.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: MTA_SERVER_URL
        value: http://sendport-mta:8000
      - key: MTA_SECRET_KEY
        value: sendport_mta_master_secret_key_2026
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false

  - type: web
    name: sendport-mta
    runtime: docker
    plan: starter
    dockerContext: server
    dockerfilePath: server/Dockerfile.mta
    envVars:
      - key: PORT
        value: "8000"
      - key: MTA_SECRET_KEY
        value: sendport_mta_master_secret_key_2026
      - key: MTA_HELO_HOST
        value: mail.getsendport.com

